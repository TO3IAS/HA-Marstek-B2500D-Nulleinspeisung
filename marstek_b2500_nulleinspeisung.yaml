blueprint:
  name: Marstek B2500 Dynamische Nulleinspeisung
  description: >-
    v2.2 – Dynamische Regelung eines Marstek B2500 (z. B. via hm2mqtt) auf Basis
    eines Netzleistungssensors wie Powerfox. Der Speicher gibt nur so viel
    Leistung ab, wie gerade aus dem Netz bezogen wird (Nulleinspeisung).


    Die Regelung arbeitet inkrementell: Basis ist der zuletzt gesetzte Sollwert,
    auf den pro Schritt nur ein Teil der gemessenen Abweichung addiert wird. Das
    haelt die traege Rueckmeldung von Sensoren und Speicher aus der Regelschleife
    heraus und verhindert Aufschaukeln.


    Enthalten: Balancing-Fenster bei vollem Speicher, Watchdog gegen eingefrorene
    Messwerte, Anlaufsperre nach dem Einschalten, SoC-Hysterese gegen
    Tiefentladung, Drosselung auf einen Sparwert bei niedrigem Akkustand oder
    Lastspitzen, Hardware-Mindestleistung und Totband.


    Wichtig: Der Netzleistungssensor muss positiv bei Netzbezug und negativ bei
    Einspeisung sein.


    Ueberschusseinspeisung und Zeitplan duerfen nie gleichzeitig aktiv sein,
    sonst gibt der Speicher gar nichts mehr ab. Wird der Schalter der
    Ueberschusseinspeisung hier angegeben, haelt die Automation die beiden
    auseinander und schaltet die Ueberschusseinspeisung fuer das Balancing
    tagsueber ein. Ohne den Schalter muss die Ueberschusseinspeisung dauerhaft
    ausgeschaltet bleiben - dann findet allerdings kein Balancing statt.
  domain: automation
  source_url: https://github.com/TO3IAS/HA-Marstek-B2500D-Nulleinspeisung/blob/main/marstek_b2500_nulleinspeisung.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    entitaeten:
      name: Entitäten
      icon: mdi:home-battery
      collapsed: false
      input:
        grid_power_sensor:
          name: Netzleistungssensor
          description: >-
            Aktuelle Netzleistung. Positiv = Bezug aus dem Netz, negativ =
            Einspeisung. Am besten ein geglätteter Sensor (Median-Helfer).
          selector:
            entity:
              domain: sensor
        speicher_input_sensor:
          name: Speicher-Ladeleistung
          description: >-
            Aktuell in den Speicher fließende Ladeleistung in Watt (z. B. von PV).
            Steuert Drosselung und Balancing-Fenster.
          selector:
            entity:
              domain: sensor
        speicher_soc_sensor:
          name: Speicher-Ladezustand (SoC)
          description: Aktueller Ladezustand des Speichers in Prozent.
          selector:
            entity:
              domain: sensor
        speicher_switch:
          name: Ausgabe-Schalter (Time Period)
          description: Schalter, der die Leistungsausgabe des Speichers aktiviert.
          selector:
            entity:
              domain: switch
        speicher_watt_number:
          name: Ausgabe-Sollwert (Time Period)
          description: >-
            Number-Entity, über die der Watt-Sollwert gesetzt wird. Ihr Wert ist
            zugleich die Basis der Regelung und der Zeitgeber für die Wartezeiten.
          selector:
            entity:
              domain: number

    regelung:
      name: Regelverhalten
      icon: mdi:sine-wave
      collapsed: false
      input:
        kp:
          name: Regelverstärkung (Kp)
          description: >-
            Anteil der gemessenen Abweichung, der pro Schritt auf den Sollwert
            addiert wird. Bei Schwingen verringern, bei trägem Verhalten erhöhen.
          default: 0.6
          selector:
            number:
              min: 0.1
              max: 1
              step: 0.05
              mode: slider
        totband_watt:
          name: Totband
          description: >-
            Mindestabweichung zwischen altem und neuem Sollwert, damit überhaupt
            geschrieben wird. Wirkt geteilt durch Kp auf den Netzbezug: 15 W bei
            Kp 0,6 entspricht rund 25 W Toleranz am Netzanschluss.
          default: 15
          selector:
            number:
              min: 0
              max: 200
              unit_of_measurement: "W"
              mode: box
        wartezeit_hoch:
          name: Wartezeit beim Erhöhen
          description: >-
            Mindestabstand seit der letzten Sollwertänderung, bevor erhöht wird.
            Gibt dem Regelkreis Zeit zum Einschwingen.
          default: 20
          selector:
            number:
              min: 0
              max: 300
              unit_of_measurement: "s"
              mode: box
        wartezeit_runter:
          name: Wartezeit beim Reduzieren
          description: >-
            Mindestabstand beim Verringern. Kürzer als beim Erhöhen, damit bei
            wegfallender Last nicht lange eingespeist wird.
          default: 8
          selector:
            number:
              min: 0
              max: 300
              unit_of_measurement: "s"
              mode: box
        anlaufsperre:
          name: Anlaufsperre nach dem Einschalten
          description: >-
            Nach dem Einschalten braucht der Speicher ein bis zwei Minuten, bis er
            Leistung liefert. Solange wird nicht nachgeregelt, sonst schaukelt
            sich der Sollwert hoch. Abschalten bleibt jederzeit möglich.
          default: 120
          selector:
            number:
              min: 0
              max: 600
              unit_of_measurement: "s"
              mode: box

    akku_schutz:
      name: Akku-Schutz
      icon: mdi:battery-alert
      collapsed: true
      input:
        soc_off:
          name: SoC Abschaltschwelle
          description: Bei diesem Ladezustand oder darunter wird die Ausgabe gesperrt.
          default: 15
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
              mode: slider
        soc_on:
          name: SoC Wiedereinschaltschwelle
          description: >-
            Erst ab diesem Ladezustand wird eine abgeschaltete Ausgabe wieder
            freigegeben. Muss über der Abschaltschwelle liegen.
          default: 25
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
              mode: slider
        soc_drossel:
          name: SoC Drosselschwelle (Eco)
          description: >-
            Unterhalb dieses Ladezustands wird auf den Drosselwert begrenzt,
            sofern nicht genug nachgeladen wird.
          default: 40
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
              mode: slider
        balancing_aktiv:
          name: Balancing-Fenster
          description: >-
            Schaltet die Überschusseinspeisung bei 100 % Ladezustand tagsüber
            ein, damit der Speicher seine Zellen balancieren kann, und nach
            Sonnenuntergang wieder aus. Setzt voraus, dass der Schalter unten
            angegeben ist. In diesem Fenster wird ins Netz eingespeist, sobald
            die PV-Leistung über dem Hausverbrauch liegt. Ist die Option aus,
            fasst die Automation die Überschusseinspeisung nicht an, hält aber
            weiterhin den Zeitplan aus, solange sie eingeschaltet ist.
          default: true
          selector:
            boolean:
        surplus_switch:
          name: Schalter Überschusseinspeisung (optional)
          description: >-
            Dringend empfohlen. Ist der Schalter angegeben, sorgt die Automation
            dafür, dass Überschusseinspeisung und Zeitplan nie gleichzeitig
            aktiv sind, und schaltet die Überschusseinspeisung für das Balancing
            tagsüber ein. Bleibt das Feld leer, muss die Überschusseinspeisung
            dauerhaft ausgeschaltet bleiben – ist sie an, würde die Regelung den
            Zeitplan dazuschalten und der Speicher stellt den Betrieb ein.
          default: []
          selector:
            entity:
              domain: switch
              multiple: true
        surplus_nachlauf:
          name: Nachlaufzeit der Überschusseinspeisung
          description: >-
            So lange muss die Ladeleistung nach Sonnenuntergang bei null liegen,
            bevor die Überschusseinspeisung wieder ausgeschaltet wird.
          default: 10
          selector:
            number:
              min: 1
              max: 120
              unit_of_measurement: "min"
              mode: box

    leistung:
      name: Leistungsgrenzen
      icon: mdi:speedometer
      collapsed: true
      input:
        max_watt:
          name: Maximale Ausgabeleistung
          description: Obergrenze der Ausgabe im Normalbetrieb und im Balancing-Fenster.
          default: 800
          selector:
            number:
              min: 0
              max: 2500
              unit_of_measurement: "W"
              mode: box
        drossel_watt:
          name: Gedrosselte Ausgabeleistung
          description: >-
            Fester Ausgabewert bei niedrigem Akkustand oder Lastspitzen. Muss
            mindestens so hoch wie die Hardware-Mindestleistung sein.
          default: 200
          selector:
            number:
              min: 0
              max: 2500
              unit_of_measurement: "W"
              mode: box
        hw_min_watt:
          name: Hardware-Mindestleistung
          description: >-
            Liegt der berechnete Sollwert darunter, wird auf 0 gesetzt und die
            Ausgabe abgeschaltet. Deckt auch Einspeisung/Überschuss ab.
          default: 80
          selector:
            number:
              min: 0
              max: 500
              unit_of_measurement: "W"
              mode: box
        drossel_hysterese:
          name: Hysterese der Drosselung
          description: >-
            Zusatzbedarf an Ladeleistung, um aus der Drosselung wieder in den
            Normalbetrieb zu wechseln. Verhindert Springen zwischen gedrosselter
            und voller Ausgabe bei schwankender PV-Leistung.
          default: 100
          selector:
            number:
              min: 0
              max: 500
              unit_of_measurement: "W"
              mode: box

    feintuning:
      name: Feintuning
      icon: mdi:tune
      collapsed: true
      input:
        max_sensor_alter:
          name: Maximales Alter des Netzwerts
          description: >-
            Ist der Netzleistungssensor länger nicht aktualisiert worden, wird die
            Ausgabe abgeschaltet. Schützt vor eingefrorenen Werten, etwa bei einer
            Störung der Powerfox-Cloud. 0 deaktiviert die Prüfung.
          default: 120
          selector:
            number:
              min: 0
              max: 900
              unit_of_measurement: "s"
              mode: box
        soc_trigger:
          name: Zusätzlicher SoC-Trigger
          description: >-
            Auch auf Änderungen des Ladezustands reagieren, damit Schwellwerte
            sofort greifen und nicht erst beim nächsten Netz-Update.
          default: true
          selector:
            boolean:

mode: restart

triggers:
  - trigger: state
    entity_id: !input grid_power_sensor
  - trigger: state
    entity_id: !input speicher_soc_sensor
    id: soc
  # Watchdog: laeuft auch dann, wenn gar keine Sensorwerte mehr eintreffen.
  # Ohne ihn koennte die Alterspruefung nie greifen.
  - trigger: time_pattern
    minutes: /1
    id: watchdog

conditions: []

actions:
  - variables:
      e_grid: !input grid_power_sensor
      e_in: !input speicher_input_sensor
      e_soc: !input speicher_soc_sensor
      e_switch: !input speicher_switch
      e_number: !input speicher_watt_number
      e_surplus: !input surplus_switch
      soc_trigger_aktiv: !input soc_trigger

  # SoC-Trigger nur auswerten, wenn in den Optionen aktiviert
  - condition: template
    value_template: >-
      {{ trigger.id is not defined or trigger.id != 'soc' or soc_trigger_aktiv }}

  # Ohne gueltige Speicherwerte laesst sich nichts sinnvoll entscheiden.
  # Der Netzsensor wird spaeter geprueft und fuehrt zum Abschalten statt Abbruch.
  - condition: template
    value_template: "{{ has_value(e_in) and has_value(e_soc) }}"

  - variables:
      kp_v: !input kp
      totband_v: !input totband_watt
      wartezeit_hoch_v: !input wartezeit_hoch
      wartezeit_runter_v: !input wartezeit_runter
      anlaufsperre_v: !input anlaufsperre
      soc_off_v: !input soc_off
      soc_on_v: !input soc_on
      soc_drossel_v: !input soc_drossel
      balancing_aktiv_v: !input balancing_aktiv
      max_watt_v: !input max_watt
      drossel_watt_v: !input drossel_watt
      hw_min_watt_v: !input hw_min_watt
      drossel_hyst_v: !input drossel_hysterese
      surplus_nachlauf_v: !input surplus_nachlauf
      max_alter_v: !input max_sensor_alter
      # Netzwert gueltig? Eingefrorene Werte zaehlen nicht als gueltig, denn bei
      # aktivem Keep-last-sample wird der Sensor nie unavailable.
      netz_ok: >-
        {{ has_value(e_grid)
           and (max_alter_v | float(0) == 0
                or (now() - states[e_grid].last_updated).total_seconds()
                    < max_alter_v | float(0)) }}
      grid_p: "{{ states(e_grid) | float(0) }}"
      speicher_in: "{{ states(e_in) | float(0) }}"
      soc: "{{ states(e_soc) | float(0) }}"
      switch_status: "{{ states(e_switch) }}"
      # Regelbasis ist der zuletzt gesetzte Sollwert, nicht die traege gemessene
      # Ausgabe. Bei ausgeschaltetem Speicher ist die reale Abgabe null.
      basis: "{{ 0 if switch_status != 'on' else states(e_number) | float(0) }}"
      sollwert: "{{ basis + grid_p * kp_v }}"
      wunsch: "{{ [sollwert | float(0), max_watt_v] | min }}"
      # Voller Speicher mit anliegender Ladeleistung: durchleiten lassen, damit
      # das BMS waehrend der Ueberschusseinspeisung balancieren kann.
      # Optionale Steuerung der Ueberschusseinspeisung.
      # Tag/Nacht ueber sun.sun; fehlt die Entity, gilt es als Tag.
      surplus_da: "{{ e_surplus | count > 0 }}"
      surplus_status: >-
        {{ states(e_surplus[0]) if surplus_da else 'none' }}
      # Firmware-Verriegelung: Zeitplan und Ueberschusseinspeisung duerfen nie
      # gleichzeitig aktiv sein, sonst stellt der Speicher den Betrieb ein.
      surplus_an: "{{ surplus_da and surplus_status == 'on' }}"
      ist_nacht: "{{ states('sun.sun') == 'below_horizon' }}"
      # Sekunden, seit die Ladeleistung zuletzt einen anderen Wert hatte
      laden_ruht: >-
        {{ speicher_in < 10
           and (now() - states[e_in].last_changed).total_seconds()
               >= surplus_nachlauf_v | float(0) * 60 }}
      surplus_ein: >-
        {{ surplus_da and balancing_aktiv_v and surplus_status == 'off'
           and soc >= 100 and not ist_nacht }}
      surplus_aus: >-
        {{ surplus_da and balancing_aktiv_v and surplus_status == 'on'
           and ist_nacht and laden_ruht }}
      ziel_leistung: >
        {# 0. Kein gueltiger Netzwert -> abschalten statt blind weiterregeln #}
        {% if not netz_ok %}
          0
        {# 1. Ueberschusseinspeisung laeuft: Zeitplan muss aus bleiben. Beides
        gleichzeitig vertraegt die Firmware nicht, dann gibt der Speicher gar
        nichts mehr ab. Waehrend dieser Zeit balanciert er seine Zellen. #}
        {% elif surplus_an %}
          0
        {# 2. Tiefentladeschutz mit Hysterese #}
        {% elif soc <= soc_off_v %}
          0
        {% elif soc < soc_on_v and switch_status != 'on' %}
          0
        {# 3. Hardware-Limit: zu kleiner Bedarf oder Ueberschuss -> aus #}
        {% elif sollwert < hw_min_watt_v %}
          0
        {# 4. Drossel-Regel bei niedrigem Akku oder Lastspitze, aber nur wenn die
        Ladeleistung die geplante Ausgabe nicht traegt. Aus der Drosselung heraus
        braucht es zusaetzlich die Hysterese, damit es nicht hin- und herspringt #}
        {% elif (soc < soc_drossel_v or sollwert > max_watt_v)
                and wunsch > drossel_watt_v
                and speicher_in < wunsch + (drossel_hyst_v if basis <= drossel_watt_v + 20 else 0) %}
          {{ drossel_watt_v }}
        {# 5. Normalbetrieb #}
        {% else %}
          {{ wunsch | round(0) }}
        {% endif %}
      seit_aenderung: >-
        {{ (now() - states[e_number].last_changed).total_seconds() }}
      # Abschalten sofort, Reduzieren zuegig, Erhoehen erst nach Einschwingen
      wartezeit: >-
        {% set z = ziel_leistung | float(0) %}
        {% if z == 0 %}0
        {% elif z < basis %}{{ wartezeit_runter_v }}
        {% else %}{{ wartezeit_hoch_v }}{% endif %}

  # Ueberschusseinspeisung tagsueber freigeben, damit der volle Speicher
  # balancieren kann. Der Zeitplan muss dabei zwingend zuerst aus, sonst
  # stellt der Speicher den Betrieb komplett ein.
  - if:
      - condition: template
        value_template: "{{ surplus_ein }}"
    then:
      - if:
          - condition: template
            value_template: "{{ switch_status != 'off' }}"
        then:
          - action: switch.turn_off
            target:
              entity_id: !input speicher_switch
      - action: switch.turn_on
        target:
          entity_id: !input surplus_switch

  # Nach Sonnenuntergang und abgeklungener Ladeleistung wieder abschalten,
  # damit der Speicher nachts normal entladen werden kann.
  - if:
      - condition: template
        value_template: "{{ surplus_aus }}"
    then:
      - action: switch.turn_off
        target:
          entity_id: !input surplus_switch

  # Totband: kleine Sollwertaenderungen gar nicht erst schreiben
  - condition: template
    value_template: "{{ (ziel_leistung | float(0) - basis) | abs >= totband_v }}"

  # Mindestabstand zwischen Sollwertaenderungen
  - condition: template
    value_template: "{{ seit_aenderung | float(0) >= wartezeit | float(999) }}"

  # Anlaufsperre: waehrend der Speicher hochfaehrt nicht nachregeln.
  # Abschalten bleibt erlaubt.
  - condition: template
    value_template: >-
      {{ ziel_leistung | float(0) == 0
         or switch_status != 'on'
         or (now() - states[e_switch].last_changed).total_seconds()
             >= anlaufsperre_v | float(0) }}

  - choose:
      # 0 W gewuenscht -> Ausgabe abschalten (nur falls nicht schon aus)
      - conditions:
          - condition: template
            value_template: "{{ ziel_leistung | float(0) == 0 }}"
          - condition: template
            value_template: "{{ switch_status != 'off' }}"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input speicher_switch

      # Leistung gewuenscht -> erst Wert setzen, dann ggf. einschalten
      - conditions:
          - condition: template
            value_template: "{{ ziel_leistung | float(0) >= hw_min_watt_v }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: !input speicher_watt_number
            data:
              value: "{{ ziel_leistung | float(0) }}"
          - if:
              - condition: template
                value_template: "{{ switch_status != 'on' }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: !input speicher_switch
